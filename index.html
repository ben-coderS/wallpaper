            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
        }
        /* 状态栏 */
        .status-bar {
            background: #fff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .status-bar .time { font-weight: 600; }
        .status-icons { display: flex; gap: 4px; align-items: center; }
        .status-icons svg { width: 16px; height: 16px; }
        
        /* 搜索栏 */
        .search-bar {
            background: #fff;
            padding: 10px 16px 12px;
            position: sticky;
            top: 32px;
            z-index: 99;
        }
        .search-box {
            background: #f0f0f0;
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box svg { width: 18px; height: 18px; color: #999; }
        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
        }
        .search-box input::placeholder { color: #999; }
        .search-btn {
            background: #fe2c55;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
        }
        
        /* 分类标签 */
        .categories {
            background: #fff;
            padding: 0 16px 12px;
            display: flex;
            gap: 24px;
            overflow-x: auto;
            position: sticky;
            top: 90px;
            z-index: 98;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            color: #666;
            font-size: 15px;
            padding: 8px 0;
            white-space: nowrap;
            cursor: pointer;
            position: relative;
        }
        .cat-btn.active { color: #fe2c55; font-weight: 600; }
        .cat-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #fe2c55;
            border-radius: 2px;
        }
        
        /* 归档状态 */
        .site-meta {
            background: #fff;
            padding: 8px 16px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #666;
        }
        .site-meta .meta-link {
            color: #fe2c55;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }
        
        /* 瀑布流 */
        .masonry {
            column-count: 2;
            column-gap: 8px;
            padding: 8px;
        }
        .masonry .item {
            break-inside: avoid;
            margin-bottom: 8px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: #e0e0e0;
        }
        .masonry .item img {
            width: 100%;
            display: block;
            transition: transform 0.3s;
        }
        .masonry .item:active img {
            transform: scale(0.98);
        }
        .masonry .item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 10px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            color: #fff;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .masonry .item:active .overlay { opacity: 1; }
        
        /* 底部导航 */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 20px;
            border-top: 1px solid #eee;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #999;
            font-size: 10px;
        }
        .nav-item svg { width: 24px; height: 24px; }
        .nav-item.active { color: #fe2c55; }
        
        /* 全屏查看器 */
        .viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 200;
            flex-direction: column;
        }
        .viewer.show { display: flex; }
        .viewer .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            color: #fff;
        }
        .viewer .close-btn {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .viewer .img-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .viewer .img-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .viewer .bottom-bar {
            padding: 16px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .viewer .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
        }
        .viewer .action-btn svg { width: 28px; height: 28px; }
    </style>
</head>

    <script>
        let currentIndex = 0;
        const images = [
            { src: 'img/20261106-080437-沙漠星夜.jpg', title: '沙漠星夜' },
            { src: 'img/20261106-080307-林深见鹿.jpg', title: '林深见鹿' },
            { src: 'img/20261106-080146-云端鲸歌.jpg', title: '云端鲸歌' },
            { src: 'img/20261106-080023-雨窗灯火.jpg', title: '雨窗灯火' },
            { src: 'img/20261105-133320-沙漠星夜.jpg', title: '沙漠星夜' },
            { src: 'img/20261105-133052-雨窗灯火.jpg', title: '雨窗灯火' },
            { src: 'img/20261105-132922-山脊日出.jpg', title: '山脊日出' },
            { src: 'img/20261105-132755-云端鲸歌.jpg', title: '云端鲸歌' },
            { src: 'img/20261104-080436-山脊日出.jpg', title: '山脊日出' },
            { src: 'img/20261104-080311-雨窗灯火.jpg', title: '雨窗灯火' },
            { src: 'img/20261104-080150-沙漠星夜.jpg', title: '沙漠星夜' },
            { src: 'img/20261104-080029-雨夜霓虹.jpg', title: '雨夜霓虹' },
            { src: 'img/20261103-184332-cloud-sea-sunrise.jpg', title: '云海日出' },
            { src: 'img/20261103-184259-rainy-window.jpg', title: '雨窗灯火' },
            { src: 'img/20261103-184130-cloud-whale.jpg', title: '云端鲸歌' },
            { src: 'img/20261103-184004-starry-tide.jpg', title: '星海潮汐' },
        ];
        
        function openViewer(index) {
            currentIndex = index;
            document.getElementById('viewerImg').src = images[index].src;
            document.getElementById('imgTitle').textContent = images[index].title;
            document.getElementById('viewer').classList.add('show');
        }
        
        function closeViewer() {
            document.getElementById('viewer').classList.remove('show');
        }
        
        function nextImg() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('viewerImg').src = images[currentIndex].src;
            document.getElementById('imgTitle').textContent = images[currentIndex].title;
        }
        
        function prevImg() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('viewerImg').src = images[currentIndex].src;
            document.getElementById('imgTitle').textContent = images[currentIndex].title;
        }
        
        async function saveImg() {
            const { src, title } = images[currentIndex];
            try {
                const resp = await fetch(src);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = title + '.jpg';
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (err) {
                alert('保存失败，请稍后重试');
            }
        }
        
        function switchCat(el, index) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
        }
        
        function searchWallpaper() {
            const keyword = document.getElementById('searchInput').value;
            if (keyword) {
                alert('搜索功能: ' + keyword);
            }
        }
        
        // 更新状态栏时间
        function updateTime() {
            const now = new Date();
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = h + ':' + m;
        }
        updateTime();
        setInterval(updateTime, 60000);
    </script>
