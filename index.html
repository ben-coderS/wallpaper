<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI壁纸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }
        h1 {
            color: #fff;
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 300;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        .wallpaper {
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            aspect-ratio: 9/21;
        }
        .wallpaper:active {
            transform: scale(0.98);
        }
        .wallpaper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .viewer.active {
            display: flex;
        }
        .viewer img {
            max-width: 100%;
            max-height: 85%;
            border-radius: 8px;
        }
        .viewer .actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        .viewer button {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
        }
        .viewer .close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .tip {
            color: #888;
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>AI壁纸精选</h1>
    <div class="grid">
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/4HcJ8lu5wS8/" alt="星空海岸">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/7L3T7zpuKlM/" alt="星河海岸">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/dIBqyTZXBoo/" alt="梦幻海岸">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/EuVHbFjZkZ8/" alt="灯塔海岸">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/tkciI2C2sc8/" alt="云海巨鲸">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/BSZQOVPry68/" alt="巨鲸云海">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/XWGy75j9Zeg/" alt="月下巨鲸">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/VB-kSP0cSD4/" alt="鲸鱼晨曦">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/wFoU_7e0h8g/" alt="月下少女">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/GP8smuu3onI/" alt="鲸鱼少女">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/vy2N0k9druo/" alt="星空少女">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/PlDQPTvzang/" alt="极光少女">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/no-DiZ07Mzk/" alt="金色溪流">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/zspTS0FROlw/" alt="秋日森林">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/VratoGKnfTY/" alt="瀑布溪流">
        </div>
        <div class="wallpaper" onclick="openViewer(this)">
            <img src="https://s.coze.cn/image/5gLdODSKzJM/" alt="金色树木">
        </div>
    </div>
    
    <p class="tip">点击图片可全屏查看，长按保存</p>
    
    <div class="viewer" id="viewer">
        <button class="close" onclick="closeViewer()">×</button>
        <img id="viewerImg" src="" alt="">
        <div class="actions">
            <button onclick="prevImg()">← 上一张</button>
            <button onclick="nextImg()">下一张 →</button>
        </div>
    </div>
    
    <script>
        let currentIndex = 0;
        const images = document.querySelectorAll('.wallpaper img');
        
        function openViewer(el) {
            const img = el.querySelector('img');
            document.getElementById('viewerImg').src = img.src;
            document.getElementById('viewer').classList.add('active');
            currentIndex = Array.from(images).indexOf(img);
        }
        
        function closeViewer() {
            document.getElementById('viewer').classList.remove('active');
        }
        
        function nextImg() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('viewerImg').src = images[currentIndex].src;
        }
        
        function prevImg() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('viewerImg').src = images[currentIndex].src;
        }
        
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('viewer').classList.contains('active')) {
                if (e.key === 'ArrowRight') nextImg();
                if (e.key === 'ArrowLeft') prevImg();
                if (e.key === 'Escape') closeViewer();
            }
        });
    </script>
</body>
</html>
