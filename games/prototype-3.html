<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>跳一跳：CEO 版 · 创业墓地</title>
<style>
  :root{
    --bg:#080b12;--card:#111827;--line:#1f2a3a;--text:#e6edf3;--dim:#8b949e;
    --gold:#f0b429;--red:#f85149;--green:#3fb950;--blue:#58a6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;user-select:none}
  #app{height:100dvh;height:100vh;display:flex;flex-direction:column;gap:6px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
  header{flex:0 0 auto}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{font-size:16px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
  .brand small{font-size:10px;color:var(--dim);font-weight:500;margin-left:4px}
  .level-pill{font-size:11px;font-weight:700;color:#0b1020;background:var(--gold);
    border-radius:999px;padding:4px 10px;white-space:nowrap}
  .hud{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;margin-top:6px}
  .hud-cell{background:#0d1421;border:1px solid var(--line);border-radius:10px;padding:5px 7px;min-width:0}
  .hud-cell .k{font-size:9px;color:var(--dim);letter-spacing:.4px}
  .hud-cell .v{font-size:14px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-cell .v.gold{color:var(--gold)}
  #stageWrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  canvas{display:block;border-radius:16px;touch-action:none;background:#0a0f18;
    box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px #1a2333 inset}
  #toast{position:fixed;left:50%;top:96px;transform:translate(-50%,-10px);opacity:0;
    background:rgba(13,20,33,.96);border:1px solid #2a3a52;color:var(--text);
    font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;pointer-events:none;
    transition:opacity .2s,transform .2s;white-space:nowrap;max-width:92%;overflow:hidden;
    text-overflow:ellipsis;z-index:40}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  footer{flex:0 0 auto}
  .hint{font-size:11px;color:var(--dim);text-align:center;line-height:1.5}
  .hint b{color:var(--gold)}
  .hidden{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(2,5,10,.78);backdrop-filter:blur(5px);
    display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
  .modal-card{width:100%;max-width:400px;max-height:86dvh;overflow:auto;background:
    linear-gradient(180deg,#121b2b,#0b111c);border:1px solid #26344a;border-radius:18px;
    padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.7)}
  .modal-tag{font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:5px}
  .modal-card h2{font-size:21px;margin:0 0 8px;line-height:1.25}
  .modal-card p{font-size:13px;line-height:1.65;color:#b8c3d1;margin:0 0 10px}
  .modal-card p.story{color:#d6dee8}
  .rulebox{background:#0a1220;border:1px solid #223148;border-radius:12px;padding:10px 12px;
    font-size:12px;line-height:1.6;color:#aab7c8;margin:10px 0}
  .rulebox b{color:var(--gold)}
  .target{font-size:13px;font-weight:700;margin:10px 0 4px}
  .target b{color:var(--gold)}
  .btn{border:none;border-radius:11px;padding:11px 14px;font-size:13px;font-weight:800;
    color:#0b1020;background:var(--gold);cursor:pointer;width:100%;transition:transform .1s,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#151f2e;color:var(--text);border:1px solid #2a3a52}
  .modal-card .btn{margin-top:12px}
  .modal-card .row{display:flex;gap:8px;margin-top:10px}
  .modal-card .row .btn{margin-top:0;flex:1}
  .meta{font-size:11px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.6}
  .statline{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .statline span{background:#0b1422;border:1px solid #223148;border-radius:8px;
    padding:5px 8px;font-size:11px;color:#c7d2df}
  .statline b{color:var(--gold)}
  .ach{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
  .ach span{background:#16202f;border:1px solid #31435c;color:#ffd56b;border-radius:999px;
    padding:4px 9px;font-size:11px;font-weight:700}
  .big-score{font-size:36px;font-weight:900;letter-spacing:1px;text-align:center;margin:6px 0 0;color:var(--gold)}
  .big-score.red{color:var(--red)}
  .center{text-align:center}
  .share-tip{font-size:10px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.5}
  @media (max-height:680px){
    .brand{font-size:14px}.hud-cell .v{font-size:12px}.hud-cell{padding:4px 6px}
    .hint{font-size:10px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="topline">
      <div class="brand">🕹️ 跳一跳：CEO 版 <small>创业墓地</small></div>
      <div class="level-pill" id="levelPill">第 1 / 3 关</div>
    </div>
    <div class="hud">
      <div class="hud-cell"><div class="k">得分</div><div class="v gold" id="scoreV">0</div></div>
      <div class="hud-cell"><div class="k">现金</div><div class="v" id="cashV">8</div></div>
      <div class="hud-cell"><div class="k">连击</div><div class="v" id="comboV">×0</div></div>
      <div class="hud-cell"><div class="k">进度</div><div class="v" id="progV">1/7</div></div>
    </div>
  </header>
  <div id="stageWrap">
    <canvas id="game"></canvas>
  </div>
  <footer><div class="hint" id="hint">按住蓄力 · 松手起跳 · 落在中心 <b>+现金</b></div></footer>
</div>

<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  const W = 360, H = 560;
  const GROUND_Y = 350, PLATFORM_H = 84;
  const MIN_DIST = 45, MAX_DIST = 270, MAX_CHARGE = 1050, JUMP_MS = 520, PEAK = 92;
  const CAM_OFFSET = 100;

  const LEVELS = [
    {
      title:'融资跳板', company:'2015 · 天使轮 → B 轮', count:7, gap:[62,102], width:[86,104], cash:8,
      labels:['想法','天使','种子','原型','A 轮','A+','B 轮'], traps:[], bankrupt:-1, ipo:-1,
      story:'你只有一个想法和一份 BP。投资人按阶段给你钱，但每一跳都要用现金换。',
      rules:'按住蓄力，松手起跳。每跳消耗 1 现金；落在平台中心 +2 现金并连击。跳到 <b>B 轮</b> 过关。',
      win:'你按节奏拿到了 B 轮。融资节奏就是跳跃节奏：太短够不着，太长会过冲。',
      lose:'融资不是无限续命，节奏错了就是深渊。'
    },
    {
      title:'扩张陷阱', company:'2019 · WeWork / Homejoy', count:10, gap:[72,126], width:[66,90], cash:8,
      labels:['招人','买量','开店','出海','补贴','组织','裁员','转型','聚焦','盈利'], traps:[2,5], bankrupt:-1, ipo:-1,
      story:'A 轮之后，所有人都在劝你扩张。城市、团队、投放——每一个看起来都像增长。',
      rules:'红色平台是<b>伪需求</b>：落上去扣 2 现金、断连击。跳到 <b>盈利</b> 过关。也可以尝试跳过去，但距离更长。',
      win:'你绕开了伪需求，落在利润上。Homejoy 激进扩张城市，服务成本击穿毛利；WeWork 用科技估值做地产。',
      lose:'增长不是把摊子铺大，是让单位经济模型成立。'
    },
    {
      title:'终局', company:'2023 · Jawbone / Quibi', count:12, gap:[78,138], width:[60,78], cash:6,
      labels:['现金','裁员','转型','聚焦','扩张','融资','内耗','出海','现金流','收缩','破产','IPO'],
      traps:[4], bankrupt:10, ipo:11,
      story:'账上只剩 6 点现金。前面是「破产」，再前面是「IPO」。你没有第三次机会。',
      rules:'跳到 <b>IPO</b> 通关。落上「破产」直接清算；也可以<b>蓄满力跳过它</b>。现金归零同样失败。',
      win:'你跳过了破产，落在 IPO 上。现实中 Jawbone 把最后的钱押在 UP4 上，2017 年清算；Quibi 上线 8 个月关停。',
      lose:'最后一跳失败。赌徒式豪赌只放大结果，不改变概率。'
    }
  ];
  const ACH = {
    firstwin:{n:'第一次起跳', d:'通关任意一关'},
    combo3:{n:'三连中心', d:'连续 3 次落在中心'},
    gamble:{n:'满蓄力生还', d:'用满蓄力跳完成终局'},
    notrap:{n:'绕开伪需求', d:'第 2 关不踩任何陷阱'},
    ipo:{n:'IPO 幸存者', d:'通关第 3 关'},
    rich:{n:'现金为王', d:'通关时现金 ≥ 5'},
  };
  const LS_BEST = 'gg_jump_best_v1';
  const LS_ACH = 'gg_jump_ach_v1';

  const $ = (id) => document.getElementById(id);
  const canvas = $('game'), ctx = canvas.getContext('2d');
  const stageWrap = $('stageWrap');
  const scoreV = $('scoreV'), cashV = $('cashV'), comboV = $('comboV'), progV = $('progV');
  const levelPill = $('levelPill'), hint = $('hint'), modal = $('modal'), modalCard = $('modalCard');
  const toastEl = $('toast');

  let state = 'menu'; // menu | playing | levelclear | win | over
  let levelIndex = 0;
  let platforms = [];
  let currentIndex = 0;
  let cash = 0, score = 0, combo = 0, maxCombo = 0, perfects = 0, trapHits = 0;
  let charging = false, chargeStart = 0, power = 0;
  let jumping = false, jumpStart = 0, jumpFromX = 0, jumpDist = 0, jumpPower = 0;
  let jumpX = 0, jumpY = GROUND_Y, falling = false, fallStartY = GROUND_Y, fallVy = 0;
  let cameraX = 0, shake = 0, particles = [];
  let levelStartMs = 0, usedMaxJump = false;
  let runAch = new Set();
  let best = Number(localStorage.getItem(LS_BEST) || 0);
  let knownAch = loadAch();
  let toastTimer = 0;
  let stars = [];
  let buildings = [];

  // ---------- 工具 ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (n) => Math.floor(n).toLocaleString('en-US');
  function loadAch() { try { return new Set(JSON.parse(localStorage.getItem(LS_ACH) || '[]')); } catch { return new Set(); } }
  function saveAch() { try { localStorage.setItem(LS_ACH, JSON.stringify([...knownAch])); } catch {} }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700);
  }
  function unlock(id) {
    if (!ACH[id] || runAch.has(id)) return;
    runAch.add(id);
    if (!knownAch.has(id)) { knownAch.add(id); saveAch(); toast('🏆 成就解锁：' + ACH[id].n); }
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- 尺寸 ----------
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = stageWrap.clientWidth, h = stageWrap.clientHeight;
    if (!w || !h) return;
    const s = Math.min(w / W, h / H);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 120));

  // ---------- 场景生成 ----------
  function buildScenery() {
    const r = mulberry32(42);
    stars = [];
    for (let i = 0; i < 46; i++) stars.push({ x: r() * W, y: 30 + r() * 220, s: 0.6 + r() * 1.4, a: 0.25 + r() * 0.6 });
    buildings = [];
    for (let i = 0; i < 40; i++) buildings.push({ x: i * 46, w: 20 + r() * 34, h: 40 + r() * 150 });
  }
  buildScenery();

  function generatePlatforms(i) {
    const cfg = LEVELS[i];
    const rnd = mulberry32(20231103 + i * 997);
    const list = [];
    let x = 70;
    for (let k = 0; k < cfg.count; k++) {
      let w = Math.round(cfg.width[0] + rnd() * (cfg.width[1] - cfg.width[0]));
      let gap = k === 0 ? 0 : Math.round(cfg.gap[0] + rnd() * (cfg.gap[1] - cfg.gap[0]));
      if (i === 2 && k === 10) { w = 52; gap = 60; }
      if (i === 2 && k === 11) { w = 60; gap = 60; }
      if (k === 1) gap = Math.max(cfg.gap[0], gap);
      if (k > 0) {
        const prev = list[k - 1];
        x = prev.x + prev.w / 2 + gap + w / 2;
      }
      let kind = 'safe';
      if (cfg.traps.includes(k)) kind = 'trap';
      if (k === cfg.bankrupt) kind = 'bankrupt';
      if (k === cfg.ipo) kind = 'ipo';
      list.push({ x, w, label: cfg.labels[k], kind, index: k });
    }
    return list;
  }

  // ---------- 关卡 ----------
  function setupLevel(i) {
    levelIndex = i;
    platforms = generatePlatforms(i);
    currentIndex = 0;
    cash = LEVELS[i].cash;
    combo = 0; maxCombo = 0; perfects = 0; trapHits = 0;
    charging = false; jumping = false; falling = false; power = 0;
    usedMaxJump = false;
    cameraX = Math.max(0, platforms[0].x - CAM_OFFSET);
    levelStartMs = performance.now();
    levelPill.textContent = `第 ${i + 1} / 3 关`;
    updateHud(true);
    draw();
  }

  function beginLevel() {
    state = 'playing';
    hideModal();
    levelStartMs = performance.now();
    toast('按住蓄力，松手起跳');
  }

  function startRun() {
    score = 0; runAch = new Set();
    setupLevel(0);
    showIntro();
  }

  function updateHud(force) {
    scoreV.textContent = fmt(score);
    cashV.textContent = String(Math.max(0, cash));
    cashV.style.color = cash <= 2 ? 'var(--red)' : 'var(--text)';
    comboV.textContent = '×' + combo;
    comboV.style.color = combo >= 2 ? 'var(--gold)' : 'var(--text)';
    progV.textContent = `${Math.min(currentIndex + 1, platforms.length)}/${platforms.length}`;
  }

  // ---------- 弹窗 ----------
  function showModal(html) { modalCard.innerHTML = html; modal.classList.remove('hidden'); }
  function hideModal() { modal.classList.add('hidden'); }

  function showIntro() {
    state = 'menu';
    const cfg = LEVELS[levelIndex];
    showModal(`
      <div class="modal-tag">${cfg.company}</div>
      <h2>${cfg.title}</h2>
      <p class="story">${cfg.story}</p>
      <div class="rulebox">${cfg.rules}</div>
      <div class="target">目标：跳到 <b>${cfg.labels[cfg.count - 1]}</b> · 现金 <b>${cfg.cash}</b></div>
      <div class="statline"><span>最高分 <b>${fmt(best)}</b></span><span>关卡 <b>${levelIndex + 1} / 3</b></span></div>
      <button class="btn" id="startLevel">开始第 ${levelIndex + 1} 关</button>
      <div class="meta">按住屏幕蓄力，松手起跳；落在平台中心会回现金。</div>
    `);
    $('startLevel').onclick = beginLevel;
  }

  function showLevelClear(cfg) {
    const last = levelIndex === 2;
    showModal(`
      <div class="modal-tag">LEVEL CLEAR · ${cfg.company}</div>
      <h2>✅ ${cfg.title} 过关</h2>
      <p>${cfg.win}</p>
      <div class="statline">
        <span>得分 <b>${fmt(score)}</b></span>
        <span>现金 <b>${cash}</b></span>
        <span>中心 <b>${perfects}</b></span>
        <span>最高连击 <b>×${maxCombo}</b></span>
      </div>
      <div class="ach">${[...runAch].map(id => `<span>🏆 ${ACH[id].n}</span>`).join('') || '<span>本关暂无成就</span>'}</div>
      <button class="btn" id="nextLevel">${last ? '查看最终战绩' : '进入第 ' + (levelIndex + 2) + ' 关'}</button>
    `);
    $('nextLevel').onclick = () => {
      if (last) showFinal(true);
      else { levelIndex++; state = 'menu'; showIntro(); }
    };
  }

  function showGameOver(reason) {
    state = 'over';
    const cfg = LEVELS[levelIndex];
    showModal(`
      <div class="modal-tag">GAME OVER · ${cfg.company}</div>
      <h2>☠️ 你出局了</h2>
      <p>${reason}。${cfg.lose}</p>
      <div class="big-score red">${fmt(score)}</div>
      <div class="center" style="font-size:11px;color:var(--dim)">本局得分 · 最高分 ${fmt(best)}</div>
      <div class="statline">
        <span>到达 <b>${cfg.labels[currentIndex]}</b></span>
        <span>中心 <b>${perfects}</b></span>
        <span>最高连击 <b>×${maxCombo}</b></span>
      </div>
      <div class="ach">${[...runAch].map(id => `<span>🏆 ${ACH[id].n}</span>`).join('') || '<span>还没有解锁成就</span>'}</div>
      <div class="row">
        <button class="btn" id="retry">重开一局</button>
        <button class="btn ghost" id="shareOver">分享战绩</button>
      </div>
      <button class="btn ghost" id="saveOver" style="margin-top:8px">保存战绩图</button>
      <div class="share-tip">${shareText(false)}</div>
    `);
    $('retry').onclick = startRun;
    $('shareOver').onclick = () => shareResult(false);
    $('saveOver').onclick = () => saveCard(false);
  }

  function showFinal(won) {
    state = won ? 'win' : 'over';
    const cfg = LEVELS[levelIndex];
    const ach = [...runAch];
    showModal(`
      <div class="modal-tag">${won ? 'IPO · SURVIVOR' : 'LIQUIDATION'}</div>
      <h2>${won ? '🔔 你跳上了 IPO' : '☠️ 清算'}</h2>
      <p>${won ? cfg.win : cfg.lose}</p>
      <div class="big-score ${won ? '' : 'red'}">${fmt(score)}</div>
      <div class="center" style="font-size:11px;color:var(--dim)">最终得分 · 最高分 ${fmt(best)}</div>
      <div class="statline">
        <span>现金 <b>${cash}</b></span>
        <span>中心 <b>${perfects}</b></span>
        <span>成就 <b>${ach.length} / 6</b></span>
      </div>
      <div class="ach">${ach.map(id => `<span>🏆 ${ACH[id].n}</span>`).join('') || '<span>这局没有解锁成就</span>'}</div>
      <div class="row">
        <button class="btn" id="shareFinal">分享战绩</button>
        <button class="btn ghost" id="retryFinal">再来一局</button>
      </div>
      <button class="btn ghost" id="saveFinal" style="margin-top:8px">保存战绩图</button>
      <div class="share-tip">${shareText(true)}</div>
    `);
    $('shareFinal').onclick = () => shareResult(true);
    $('retryFinal').onclick = startRun;
    $('saveFinal').onclick = () => saveCard(true);
  }

  // ---------- 跳跃逻辑 ----------
  function startCharge() {
    if (state !== 'playing' || jumping || falling || charging) return;
    charging = true;
    chargeStart = performance.now();
    power = 0.04;
  }

  function releaseCharge() {
    if (!charging || state !== 'playing' || jumping || falling) return;
    const p = clamp((performance.now() - chargeStart) / MAX_CHARGE, 0.04, 1);
    charging = false;
    startJump(p);
  }

  function startJump(p) {
    power = p;
    jumpPower = p;
    jumpFromX = platforms[currentIndex].x;
    jumpDist = MIN_DIST + p * (MAX_DIST - MIN_DIST);
    jumpStart = performance.now();
    jumping = true;
    usedMaxJump = usedMaxJump || p > 0.95;
    if (p > 0.95) toast('🎲 满蓄力：豪赌一跳');
  }

  function resolveLanding(landX) {
    if (state !== 'playing') return;
    let hit = -1;
    for (let i = currentIndex + 1; i < platforms.length; i++) {
      const p = platforms[i];
      if (Math.abs(landX - p.x) <= p.w / 2) { hit = i; break; }
    }
    if (hit < 0) { startFall(landX); return; }

    const p = platforms[hit];
    const skipped = hit - currentIndex - 1;
    currentIndex = hit;
    cash -= 1;
    score += 100 + skipped * 50;
    const perfect = Math.abs(landX - p.x) <= Math.max(5, p.w * 0.1);
    if (perfect) {
      combo++; maxCombo = Math.max(maxCombo, combo); perfects++;
      cash += 2;
      score += 50 * combo;
      spawnParticles(p.x, GROUND_Y, '#f0b429', 8 + Math.min(10, combo * 2));
      shake = 5;
      if (combo >= 3) unlock('combo3');
      toast(combo >= 2 ? `🎯 中心 ×${combo}  +${50 * combo}` : '🎯 完美中心  +2 现金');
    } else {
      combo = 0;
      toast('落点一般');
    }

    if (p.kind === 'trap') {
      cash -= 2; trapHits++; combo = 0;
      score = Math.max(0, score - 30);
      toast('💀 伪需求：现金 -2 · 连击清零');
      shake = 8;
    }

    jumpX = p.x; jumpY = GROUND_Y;
    cameraX = Math.max(0, p.x - CAM_OFFSET);
    if (p.kind === 'bankrupt') { lose('你跳进了「破产」'); return; }
    if (hit === platforms.length - 1) { winLevel(); return; }
    if (cash <= 0) { lose('现金烧完'); return; }
    updateHud(true);
  }

  function startFall(landX) {
    if (state !== 'playing') return;
    falling = true; jumpX = landX; jumpY = GROUND_Y; fallVy = 0; fallStartY = GROUND_Y;
    setTimeout(() => { if (falling && state === 'playing') lose('掉下去了'); }, 950);
  }

  function winLevel() {
    if (state !== 'playing') return;
    state = 'levelclear';
    const cfg = LEVELS[levelIndex];
    score += 500 + Math.max(0, cash) * 100;
    unlock('firstwin');
    if (levelIndex === 1 && trapHits === 0) unlock('notrap');
    if (levelIndex === 2) { unlock('ipo'); if (usedMaxJump) unlock('gamble'); }
    if (Math.max(0, cash) >= 5) unlock('rich');
    best = Math.max(best, score);
    try { localStorage.setItem(LS_BEST, String(best)); } catch {}
    setTimeout(() => showLevelClear(cfg), 650);
  }

  function lose(reason) {
    if (state !== 'playing') return;
    state = 'over';
    best = Math.max(best, score);
    try { localStorage.setItem(LS_BEST, String(best)); } catch {}
    setTimeout(() => showGameOver(reason), 500);
  }

  // ---------- 粒子 ----------
  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, sp = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.5, color, r: 2 + Math.random() * 3 });
    }
  }

  // ---------- 绘制 ----------
  function draw() {
    const now = performance.now();
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.translate(sx, sy);

    // 天空
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0a1222');
    sky.addColorStop(0.65, '#0a0f19');
    sky.addColorStop(1, '#06080d');
    ctx.fillStyle = sky; ctx.fillRect(-10, -10, W + 20, H + 20);

    // 星星
    for (const s of stars) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#cfe4ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 月亮
    ctx.beginPath(); ctx.arc(300, 76, 22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(240,180,41,.9)'; ctx.fill();
    ctx.beginPath(); ctx.arc(292, 70, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#0a1222'; ctx.fill();

    // 天际线（视差）
    for (const b of buildings) {
      const bx = ((b.x - cameraX * 0.28) % 1840 + 1840) % 1840 - 120;
      if (bx > W + 60 || bx < -80) continue;
      ctx.fillStyle = 'rgba(18,30,48,.9)';
      ctx.fillRect(bx, GROUND_Y - b.h, b.w, b.h);
      ctx.fillStyle = 'rgba(88,166,255,.22)';
      for (let wy = GROUND_Y - b.h + 10; wy < GROUND_Y - 8; wy += 16) {
        for (let wx = bx + 5; wx < bx + b.w - 5; wx += 10) {
          if ((Math.floor(wx + wy) % 3) === 0) ctx.fillRect(wx, wy, 3, 3);
        }
      }
    }

    // 地面雾
    const fog = ctx.createLinearGradient(0, GROUND_Y - 30, 0, H);
    fog.addColorStop(0, 'rgba(9,14,23,0)');
    fog.addColorStop(1, 'rgba(9,14,23,.95)');
    ctx.fillStyle = fog; ctx.fillRect(0, GROUND_Y - 30, W, H - GROUND_Y + 30);

    // 平台
    for (const p of platforms) drawPlatform(p);

    // 粒子
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x - cameraX, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // CEO
    drawCeo();

    // 蓄力条
    if (state === 'playing') drawPowerBar(now);

    // 连击提示
    if (combo >= 2 && state === 'playing') {
      ctx.fillStyle = 'rgba(240,180,41,.85)';
      ctx.font = '900 12px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(`CENTER ×${combo}`, W / 2, 28);
    }

    // 关卡提示
    if (state === 'playing' && !charging && !jumping && !falling) {
      ctx.fillStyle = 'rgba(230,237,243,.5)';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('按住屏幕蓄力', W / 2, H - 58);
    }

    ctx.restore();
    shake = Math.max(0, shake - 0.5);
  }

  function drawPlatform(p) {
    const x = p.x - cameraX;
    if (x + p.w / 2 < -20 || x - p.w / 2 > W + 20) return;
    const topY = GROUND_Y;
    const isCurrent = p.index === currentIndex;
    const isNext = p.index === currentIndex + 1;
    let top, body, labelColor, glow;
    if (p.kind === 'trap') { top = '#6d2a2a'; body = '#271113'; labelColor = '#ff9a94'; glow = 'rgba(248,81,73,.35)'; }
    else if (p.kind === 'bankrupt') { top = '#4a1218'; body = '#1c090c'; labelColor = '#ff7b72'; glow = 'rgba(248,81,73,.5)'; }
    else if (p.kind === 'ipo') { top = '#7a5712'; body = '#2a200c'; labelColor = '#ffd35c'; glow = 'rgba(240,180,41,.55)'; }
    else { top = '#2b4a6f'; body = '#142235'; labelColor = '#b9d2ea'; glow = 'rgba(88,166,255,.25)'; }

    // 顶部发光
    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur = isCurrent ? 22 : (isNext ? 14 : 0);
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x - p.w / 2, topY - 8, p.w, 14, 5) : ctx.rect(x - p.w / 2, topY - 8, p.w, 14);
    ctx.fillStyle = top; ctx.fill();
    ctx.restore();

    // 侧面
    ctx.fillStyle = body;
    ctx.fillRect(x - p.w / 2, topY + 4, p.w, PLATFORM_H);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(x - p.w / 2, topY + 4, p.w, 3);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(x + p.w / 2 - 5, topY + 4, 5, PLATFORM_H);

    // 中心线
    ctx.save();
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = 'rgba(240,180,41,.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, topY - 12); ctx.lineTo(x, topY + 8); ctx.stroke();
    ctx.restore();
    // 标签放在平台侧面内部，避免被站在平台上的 CEO 挡住
    ctx.fillStyle = isCurrent ? '#ffffff' : labelColor;
    ctx.font = `${isCurrent ? '900' : '700'} 11px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(p.label, x, topY + 30);
    if (p.kind === 'trap') {
      ctx.fillStyle = '#ff7b72';
      ctx.font = '900 9px system-ui';
      ctx.fillText('⚠ 伪需求', x, topY + 51);
    }
    if (p.kind === 'bankrupt') {
      ctx.fillStyle = '#ff7b72';
      ctx.font = '900 9px system-ui';
      ctx.fillText('⚠ 直接清算', x, topY + 51);
    }
    if (p.kind === 'ipo') {
      ctx.fillStyle = '#ffd35c';
      ctx.font = '900 9px system-ui';
      ctx.fillText('★ 终点', x, topY + 51);
    }

    // 当前角色脚下的光圈
    if (isCurrent && state !== 'menu') {
      ctx.beginPath();
      ctx.ellipse(x, topY - 2, p.w * 0.34, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(240,180,41,.35)';
      ctx.fill();
    }
  }

  function drawCeo() {
    if (!platforms.length || !platforms[currentIndex]) return;
    let x, y, crouch = 0, rot = 0;
    if (jumping) {
      x = jumpX; y = jumpY; rot = -0.08;
    } else if (falling) {
      x = jumpX; y = jumpY; rot = 0.6;
    } else {
      x = platforms[currentIndex].x; y = GROUND_Y;
      if (charging) crouch = Math.min(10, (performance.now() - chargeStart) / 90);
    }
    const sx = x - cameraX;
    ctx.save();
    ctx.translate(sx, y - crouch);
    ctx.rotate(rot);
    // 影子
    if (!jumping && !falling) {
      ctx.beginPath(); ctx.ellipse(0, 2, 12, 3, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
    }
    // 腿
    ctx.strokeStyle = '#d7e3f4'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-2, -16); ctx.lineTo(-6, 0); ctx.moveTo(2, -16); ctx.lineTo(7, 0); ctx.stroke();
    // 身体
    ctx.strokeStyle = '#e6edf3'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(0, -16); ctx.stroke();
    // 领带
    ctx.strokeStyle = '#f85149'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(0, -26); ctx.stroke();
    // 手
    ctx.strokeStyle = '#d7e3f4'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(-11, -22); ctx.moveTo(0, -32); ctx.lineTo(11, -22); ctx.stroke();
    // 头
    ctx.beginPath(); ctx.arc(0, -46, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd7b0'; ctx.fill();
    ctx.strokeStyle = '#0b1020'; ctx.lineWidth = 1.5; ctx.stroke();
    // 头发
    ctx.beginPath(); ctx.arc(0, -48, 8, Math.PI, Math.PI * 2);
    ctx.fillStyle = '#1b2430'; ctx.fill();
    // 眼睛
    ctx.fillStyle = '#0b1020';
    ctx.beginPath(); ctx.arc(-3, -46, 1.2, 0, Math.PI * 2); ctx.arc(3, -46, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawPowerBar(now) {
    const x = 22, y = H - 34, w = W - 44, h = 12;
    ctx.fillStyle = 'rgba(8,14,24,.86)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - 2, y - 2, w + 4, h + 4, 8) : ctx.rect(x - 2, y - 2, w + 4, h + 4); ctx.fill();
    ctx.strokeStyle = 'rgba(88,166,255,.18)'; ctx.lineWidth = 1; ctx.stroke();
    let p = 0;
    if (charging) p = clamp((now - chargeStart) / MAX_CHARGE, 0.04, 1);
    else if (jumping) p = jumpPower;
    const fill = ctx.createLinearGradient(x, 0, x + w, 0);
    fill.addColorStop(0, '#3fb950'); fill.addColorStop(0.6, '#f0b429'); fill.addColorStop(1, '#f85149');
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, Math.max(0, w * p), h, 6) : ctx.rect(x, y, Math.max(0, w * p), h); ctx.fill();
    if (p > 0.95) {
      ctx.fillStyle = '#ff7b72';
      ctx.font = '900 9px system-ui'; ctx.textAlign = 'right';
      ctx.fillText('豪赌', x + w, y - 6);
    }
    ctx.fillStyle = 'rgba(230,237,243,.65)';
    ctx.font = '700 9px system-ui'; ctx.textAlign = 'left';
    ctx.fillText(charging ? `蓄力 ${Math.round(p * 100)}%` : '蓄力条', x, y - 6);
  }

  // ---------- 主循环 ----------
  let lastTs = 0;
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000; lastTs = ts;
    if (dt > 0.05) dt = 0.05;
    if (state === 'playing') {
      if (jumping) {
        const t = clamp((ts - jumpStart) / JUMP_MS, 0, 1);
        jumpX = jumpFromX + jumpDist * t;
        jumpY = GROUND_Y - 4 * PEAK * t * (1 - t);
        if (t >= 1) {
          jumping = false;
          const landX = jumpFromX + jumpDist;
          jumpX = landX; jumpY = GROUND_Y;
          resolveLanding(landX);
        }
      } else if (falling) {
        fallVy += 900 * dt;
        jumpY += fallVy * dt;
      }
    }
    // 相机
    const baseX = platforms[currentIndex] ? platforms[currentIndex].x : 0;
    const target = Math.max(0, (jumping || falling ? jumpX : baseX) - CAM_OFFSET);
    cameraX = lerp(cameraX, target, state === 'playing' ? Math.min(1, dt * 7) : 1);
    // 粒子
    for (const pt of particles) { pt.vy += 700 * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
    particles = particles.filter(pt => pt.life > 0);
    updateHud();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  let pointerId = null;
  function canvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state !== 'playing' || jumping || falling) return;
    pointerId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch {}
    startCharge();
  }, { passive: false });
  window.addEventListener('pointerup', (e) => {
    e.preventDefault();
    if (pointerId !== null && e.pointerId !== pointerId) return;
    pointerId = null;
    releaseCharge();
  }, { passive: false });
  window.addEventListener('pointercancel', () => { pointerId = null; charging = false; });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); startCharge(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); releaseCharge(); }
  });

  // ---------- 分享 ----------
  function shareText(won) {
    return `【跳一跳 CEO 版】${won ? 'IPO 通关' : '倒在第 ' + (levelIndex + 1) + ' 关'}｜得分 ${fmt(score)}｜最高连击 ×${maxCombo}｜现金 ${cash}\n创业墓地 · 第 1210 号${won ? '幸存者' : '展品'}`;
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
    } catch { return false; }
  }
  async function shareResult(won) {
    const text = shareText(won);
    if (navigator.share) { try { await navigator.share({ title: '跳一跳 CEO 版', text }); return; } catch {} }
    const ok = await copyText(text);
    toast(ok ? '✅ 战绩已复制，去粘贴吧' : '复制失败，请长按文字');
  }
  function saveCard(won) {
    const c = document.createElement('canvas');
    c.width = 600; c.height = 800;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 800);
    g.addColorStop(0, '#0b1220'); g.addColorStop(1, '#070a11');
    x.fillStyle = g; x.fillRect(0, 0, 600, 800);
    x.strokeStyle = '#26344a'; x.lineWidth = 3; x.strokeRect(18, 18, 564, 764);
    x.textAlign = 'center';
    x.fillStyle = '#f0b429'; x.font = '900 34px system-ui'; x.fillText('跳一跳 CEO 版', 300, 100);
    x.fillStyle = '#8b949e'; x.font = '600 16px system-ui'; x.fillText('创业墓地 · GRAVEYARD GAME', 300, 134);
    x.fillStyle = won ? '#3fb950' : '#f85149'; x.font = '900 58px system-ui';
    x.fillText(won ? 'IPO 通关' : '掉下去了', 300, 250);
    x.fillStyle = '#e6edf3'; x.font = '900 72px system-ui'; x.fillText(fmt(score), 300, 360);
    x.fillStyle = '#8b949e'; x.font = '600 18px system-ui'; x.fillText('最终得分', 300, 395);
    x.fillStyle = '#c7d2df'; x.font = '600 20px system-ui';
    x.fillText(`第 ${levelIndex + 1} 关 · 中心 ${perfects} · 现金 ${cash}`, 300, 470);
    x.fillStyle = '#5d6b7f'; x.font = '600 16px system-ui';
    x.fillText(shareText(won).split('\n')[0], 300, 540);
    x.fillStyle = '#f0b429'; x.font = '700 16px system-ui';
    x.fillText('长按保存 / 截图分享', 300, 700);
    c.toBlob((blob) => {
      if (!blob) { toast('保存失败'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `跳一跳CEO-${won ? 'IPO' : '掉下去'}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('🖼 战绩图已生成');
    }, 'image/png');
  }

  // ---------- 启动 ----------
  window.addEventListener('load', () => { fit(); startRun(); requestAnimationFrame(loop); });
  fit();

  // ---------- 调试钩子（仅供本地自动化测试） ----------
  window.__game = {
    get state() { return state; },
    get level() { return levelIndex; },
    get current() { return currentIndex; },
    get cash() { return cash; },
    get score() { return score; },
    get combo() { return combo; },
    get trapHits() { return trapHits; },
    get perfects() { return perfects; },
    get platforms() { return platforms.map(p => ({ x: p.x, w: p.w, label: p.label, kind: p.kind })); },
    get jumping() { return jumping; },
    get falling() { return falling; },
    get charging() { return charging; },
    start() { startRun(); },
    begin() { beginLevel(); },
    setup(i) { setupLevel(i); state = 'playing'; hideModal(); },
    jump(p) { if (state === 'playing' && !jumping && !falling && !charging) startJump(p); },
    powerFor(index) {
      const d = platforms[index].x - platforms[currentIndex].x;
      return (d - MIN_DIST) / (MAX_DIST - MIN_DIST);
    },
    jumpTo(index) { const p = this.powerFor(index); if (p > 1.001) return false; this.jump(clamp(p, 0.04, 1)); return true; },
    loseNow() { lose('调试'); },
  };
})();
</script>
</body>
</html>
